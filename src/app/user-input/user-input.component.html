<form (ngSubmit)="onSubmit()" >
  <div class="input-group">
    <p>
      <label for="initial-investment">Initial Investment</label>
      <input type="number" 
             id="initial-investment" 
             [(ngModel)]="enteredInitialInvestment" 
             name="initial-investment" required
        >
    </p>

    <p>
      <label for="annual-investment">Annual Investment</label>
      <input type="number" id="annual-investment" name="annual-investment" [(ngModel)]="enteredAnnualInvestment" >
    </p>
</div>

<div class="input-group">
    <p>
        <label for="expected-returns">Expected Returns</label>
        <input type="number" id="expected-returns" name="expected-returns" [(ngModel)]="enteredExpectedReturns" >
      </p>
  
      <p>
        <label for="duration">Duration</label>
        <input type="number" id="duration" name="duration" [(ngModel)]="enteredDuration" >
      </p>
</div>

  <button type="submit">Calculate</button>
</form>
